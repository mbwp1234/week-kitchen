name: Week Kitchen
version: "0.2.4"
slug: week_kitchen
description: Weekly meal plan, recipe box, shopping list and cook mode, kept as JSON files in a folder you choose.
url: https://github.com/mbwp1234/week-kitchen
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
homeassistant_api: true
ingress_port: 8099
panel_icon: mdi:chef-hat
panel_title: Kitchen
# Without this the sidebar panel is admin-only and every non-admin household member never sees it.
panel_admin: false
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
options:
  data_dir: /share/recipes
  timer_notify: []
  tonight_sensor: true
schema:
  data_dir: str
  timer_notify:
    - str
  tonight_sensor: bool
