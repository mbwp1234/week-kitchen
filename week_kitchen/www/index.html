<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Week Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a stovetop control panel. Week rail on top, recipe = ingredient tray + numbered steps; Cook mode is a full-screen burner view with a heat gauge. */
:root{
  --bg:#ECEFF0; --panel:#FFFFFF; --ink:#13202A; --muted:#55636E; --line:#C9D1D6;
  --flame:#2552E0; --flame-soft:#DCE4FC; --kid:#0F7A55; --kid-soft:#DDF2E8; --hot:#D9480F;
  --h1:#2E6BE6; --h2:#3E8FD8; --h3:#E0A21A; --h4:#E86A1C; --h5:#D12B1F; --gauge-off:#D5DBDF;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --tray-h:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --panel:#172129; --ink:#E7EDF1; --muted:#9AA8B2; --line:#2B3843;
  --flame:#7C9BFF; --flame-soft:#1D2A4D; --kid:#4CD39B; --kid-soft:#123528; --hot:#FF8A4C;
  --gauge-off:#2A3640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1418; --panel:#172129; --ink:#E7EDF1; --muted:#9AA8B2; --line:#2B3843;
  --flame:#7C9BFF; --flame-soft:#1D2A4D; --kid:#4CD39B; --kid-soft:#123528; --hot:#FF8A4C;
  --gauge-off:#2A3640; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(48px + var(--tray-h))}
/* minmax(0,1fr), not 1fr: a 1fr track grows to its widest unbreakable content (a nowrap line, a long word)
   and drags the whole page wider than the phone. */
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.top>*,.head>*,.titlewrap>*{min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font:700 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.top h1{font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1}
.top h1 #titleAccent{color:var(--flame)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
.pill[aria-pressed="true"]{border-color:var(--flame);color:var(--flame);background:var(--flame-soft)}

/* week rail */
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
@media (max-width:760px){.rail{grid-template-columns:repeat(2,minmax(0,1fr))}}
.day{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:grid;gap:4px;min-width:0}
.day .d{font:700 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.day .n{font:700 17px/1.2 var(--f-display)}
.day .m{font-size:13px;color:var(--muted)}
.day[aria-current="true"]{border-color:var(--flame);box-shadow:0 0 0 3px var(--flame-soft)}
.today{color:var(--hot)}
.bar{height:4px;border-radius:4px;background:var(--gauge-off);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--flame);width:0;transition:width .3s}

/* recipe */
.recipe{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:20px;align-items:start}
@media (max-width:820px){.recipe{grid-template-columns:1fr}}
.head{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
.head h2{font-size:clamp(26px,4.2vw,38px);font-weight:800;line-height:1.05}
.facts{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.facts b{color:var(--ink);font-family:var(--f-mono)}
.cook{background:var(--flame);color:#fff;border:0;border-radius:14px;padding:14px 22px;font:800 18px/1 var(--f-display);display:flex;gap:10px;align-items:center}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0}
.card h3{font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font:500 12px var(--f-mono);color:var(--muted)}
.ing{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.ing label{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-radius:8px;cursor:pointer}
.ing label:hover{background:var(--bg)}
.ing input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--flame);flex:none}
.ing input:checked+span{color:var(--muted);text-decoration:line-through}
.note{background:var(--kid-soft);border-radius:12px;padding:12px 14px;font-size:14.5px}
.note b{color:var(--kid)}
.note.warn{background:var(--flame-soft)} .note.warn b{color:var(--flame)}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;padding:12px;border-radius:12px;border:1.5px solid transparent;text-align:left;width:100%;background:none}
.step:hover{background:var(--bg)}
.step.on{border-color:var(--flame);background:var(--flame-soft)}
.step.done .num{background:var(--flame);color:#fff;border-color:var(--flame)}
.num{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 14px var(--f-mono);font-variant-numeric:tabular-nums}
.st{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font:700 12px/1 var(--f-mono);padding:5px 8px;border-radius:6px;border:1.5px solid currentColor;display:inline-flex;gap:6px;align-items:center}
.chip.kid{color:var(--kid);background:var(--kid-soft);border-color:transparent}
.chip.time{color:var(--muted)}
.flames{display:inline-flex;gap:2px}
.flames i{width:4px;height:10px;border-radius:2px;background:var(--gauge-off)}

/* cook mode */
.cm{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px) + var(--tray-h)) max(16px,env(safe-area-inset-left,0px))}
.cm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1000px;width:100%;margin:0 auto}
.cm-top .t{font:800 18px var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-prog{display:flex;gap:4px;max-width:1000px;width:100%;margin:10px auto 0}
.cm-prog i{flex:1;height:5px;border-radius:3px;background:var(--gauge-off)}
.cm-prog i.y{background:var(--flame)}
.cm-body{overflow:auto;max-width:1000px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-content:center;padding-block:16px}
@media (max-width:760px){.cm-body{grid-template-columns:1fr;align-content:start;gap:16px}}
.cm-n{font:700 14px var(--f-mono);color:var(--flame);letter-spacing:.08em}
.cm-h{font-size:clamp(30px,5.4vw,52px);font-weight:800;line-height:1.02;margin:6px 0 14px}
.cm-txt{font-size:clamp(18px,2.3vw,23px);line-height:1.5;max-width:40ch}
.cm-txt strong{color:var(--hot)}
.cm-side{display:grid;gap:14px;align-content:start}
.gauge{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:grid;justify-items:center;gap:4px}
.gauge svg{width:100%;max-width:240px;height:auto}
.gauge .lv{font:800 24px var(--f-display)}
.gauge .hint{font-size:14px;color:var(--muted);text-align:center}
.bigtimer{border:0;border-radius:16px;background:var(--ink);color:var(--bg);padding:16px;font:800 20px var(--f-display);display:flex;justify-content:center;gap:10px;align-items:center}
.bigtimer .tm{font:700 22px var(--f-mono)}
.cm-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;max-width:1000px;width:100%;margin:0 auto}
.cm-nav button{border-radius:16px;padding:18px;font:800 20px var(--f-display);border:1.5px solid var(--line);background:var(--panel)}
.cm-nav .next{background:var(--flame);border-color:var(--flame);color:#fff}
.x{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;width:40px;height:40px;font-size:20px;line-height:1;flex:none}

/* timer tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.tmr{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:100%}
.tmr .l{font-size:13px;max-width:22ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr .c{font:700 18px var(--f-mono);font-variant-numeric:tabular-nums}
.tmr button{border:0;border-radius:999px;background:rgba(255,255,255,.16);color:inherit;padding:6px 10px;font-size:13px;font-weight:700}
.tmr.ring{background:var(--hot);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.tmr.ring{animation:none}.bar i{transition:none}}
.foot{color:var(--muted);font-size:13px;text-align:center}
[hidden]{display:none!important}
.dish-svg{width:100%;height:auto;display:block;overflow:visible}
.titlewrap{display:flex;gap:16px;align-items:center;min-width:0}
.hero-dish{width:132px;flex:none;background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:6px 10px}
@media (max-width:520px){.hero-dish{width:96px;padding:4px 6px}}
.day{grid-template-columns:minmax(0,1fr) 54px;column-gap:8px}
.day .d{flex-wrap:wrap;row-gap:3px}.day .d>span{white-space:nowrap}
.day>*{grid-column:1}.day .thumb{grid-column:2;grid-row:1 / span 3;align-self:center}.day .bar{grid-column:1 / -1}
button.rart{border:0;width:100%;cursor:pointer;padding:8px 40px}
.views{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:10px}
.views button{background:none;border:0;border-radius:10px;padding:8px 14px;font:800 16px var(--f-display);color:var(--muted)}
.views button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.love{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 14px;font-weight:700}
.love svg{width:20px;height:20px;fill:none;stroke:var(--hot);stroke-width:2}
.love[aria-pressed="true"]{border-color:var(--hot);color:var(--hot)}
.love[aria-pressed="true"] svg{fill:var(--hot);animation:beat .5s}
.love:disabled{opacity:.5;cursor:default}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding-block:30px}
.empty p{color:var(--muted);max-width:44ch;margin:0}
.box,.plan{display:grid;gap:18px}
.box .head,.plan .head{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between}
.box h2,.plan h2{font-size:clamp(26px,4.2vw,38px);font-weight:800}
.boxtools{display:flex;gap:8px;flex-wrap:wrap}
.boxtools input{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.boxtools input{width:min(280px,100%)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:9px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--flame-soft);color:var(--flame)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rcard{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.rart{background:var(--bg);border-radius:12px;padding:6px 30px}
.rart svg{width:100%;height:auto;display:block}
.rcard h3{font-size:18px}
.rcard .m,.nm{font-size:13px;color:var(--muted)}
.inweek{color:var(--kid);font-weight:700}
.ract{display:flex;gap:8px;justify-content:space-between}
.planner,.shop{display:grid;gap:14px}
.shop .card h3 small{font:500 12px var(--f-mono);color:var(--muted)}
.mealpick{display:flex;flex-wrap:wrap;gap:8px}
.mp{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 12px 6px 6px;font-size:14px;line-height:1.25;color:var(--muted)}
.mp b{color:var(--ink);font:800 14px var(--f-display)}
.mpthumb{width:46px;flex:none;filter:grayscale(1);opacity:.5}
.mp[aria-pressed="true"]{border-color:var(--kid);background:var(--kid-soft);color:var(--ink)}
.mp[aria-pressed="true"] .mpthumb{filter:none;opacity:1}
.shopgroup .ing label{align-items:center}
.amt{font-family:var(--f-mono);font-weight:700;margin-right:2px}
.for{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.ing input:checked+span .for{text-decoration:none}
.pantry{background:transparent;border-style:dashed}
.copyarea{display:none;width:100%;min-height:160px;font:14px/1.5 var(--f-mono);color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.copyarea.show{display:block}
.shopgroup label{cursor:copy}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px) + var(--tray-h));z-index:70;background:var(--ink);color:var(--bg);font-weight:700;border-radius:999px;padding:10px 18px;max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.phead{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between}
.phead h2{font-size:clamp(26px,4.2vw,38px);font-weight:800}
.hint{margin:0;color:var(--muted);font-size:15px}.hint b{color:var(--flame)}
.linkbtn{border:0;background:none;color:var(--flame);font-weight:700;text-decoration:underline;padding:0}
.pgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.pdays{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pslot{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center;min-height:68px;padding:8px 10px;background:var(--panel);border:2px solid var(--line);border-radius:16px;transition:border-color .15s,background .15s}
.pslot.open{border-style:dashed;background:transparent}
.pslot.target{border-color:var(--flame);border-style:dashed;cursor:pointer}
.pslot.over{border-color:var(--flame);border-style:solid;background:var(--flame-soft)}
.pday{display:grid;line-height:1.15}.pday b{font:800 19px var(--f-display)}.pday span{font-size:13px;color:var(--muted)}.pday em{font:700 11px var(--f-mono);font-style:normal;color:var(--hot);letter-spacing:.08em;text-transform:uppercase}
.pfill{min-width:0}.wrapfill{display:flex;flex-wrap:wrap;gap:6px}
.pempty{color:var(--muted);font-size:14px}
.pmeal{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:4px 6px 4px 4px;cursor:grab;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pmthumb{width:52px;flex:none}.pmname{font:700 16px var(--f-display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmx{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;width:34px;height:34px;border-radius:50%;flex:none}
.pmx:hover{background:var(--panel);color:var(--hot)}
.ptray{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px;max-height:calc(100vh - 40px);overflow:auto}
.ptray-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.ptray-h b{font:800 17px var(--f-display)}.ptray-h .m{font-size:12px;color:var(--muted)}
.ptray-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tcard{display:grid;justify-items:center;text-align:center;gap:2px;padding:8px 6px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tcard:hover{border-color:var(--flame)}
.tthumb{width:72px;display:block}
.tname{font:700 14px/1.2 var(--f-display)}.tname .lv{color:var(--hot);font-style:normal;margin-right:4px}
.tmeta{font-size:12px;color:var(--muted)}
.tcard.used .tmeta{color:var(--kid);font-weight:700}
.tcard.armed,.pmeal.armed{outline:3px solid var(--flame);outline-offset:1px;background:var(--flame-soft);opacity:1}
.lifting{opacity:.35}
body.dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
.ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--flame);border-radius:14px;padding:6px 12px 6px 6px;font:800 15px var(--f-display);box-shadow:0 12px 30px rgba(0,0,0,.25);transform-origin:center}
.ghost .tthumb{width:56px}
@media (max-width:760px){
 .pgrid{grid-template-columns:1fr}
 .ptray{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;max-height:none;border-radius:18px 18px 0 0;border-width:1.5px 0 0;
   padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 24px rgba(0,0,0,.12)}
 .ptray-list{display:flex;overflow-x:auto;gap:8px;padding-bottom:2px;scroll-snap-type:x proximity}
 .tcard{flex:0 0 108px;scroll-snap-align:start}.tthumb{width:62px}
 .planner{padding-bottom:190px}
}

/* ---------- cute kitchen animations ---------- */
.top-l{display:flex;align-items:end;gap:12px}
.mascot{width:72px;flex:none}
.anim{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;display:grid;place-items:center;padding:6px 10px;margin-bottom:14px;max-width:300px}
.anim svg,.mascot svg,.party svg{width:100%;height:auto;display:block;overflow:visible}
.anim .cap{font:700 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:2px 0 6px}
svg *{transform-box:fill-box}
.a-steam{transform-origin:50% 100%;animation:steam 2.6s ease-in infinite;opacity:0}
.a-steam.f{animation-duration:1.5s}
.a-rise{animation:rise 1.8s ease-in infinite;opacity:0}
.a-rise.f{animation-duration:.9s}
.a-lid{transform-origin:50% 100%;animation:lid 1.6s ease-in-out infinite}
.a-rattle{transform-origin:50% 100%;animation:rattle .35s ease-in-out infinite}
.a-hop{transform-origin:50% 100%;animation:hop .9s ease-in-out infinite}
.a-pop{transform-origin:50% 50%;animation:pop 1s ease-out infinite;opacity:0}
.a-stir{transform-origin:50% 100%;animation:stir 1.8s ease-in-out infinite}
.a-chop{transform-origin:100% 50%;animation:chop .6s ease-in-out infinite}
.a-slide{animation:slide 1.2s linear infinite}
.a-whisk{transform-origin:50% 0%;animation:whisk .45s ease-in-out infinite alternate}

<script>
const HEAT={
  H:{lv:5,name:"High",hint:"Only for bringing water or soup to a boil."},
  MH:{lv:4,name:"Medium-high",hint:"Searing and stir-frying. Oil shimmers and moves like water."},
  M:{lv:3,name:"Medium",hint:"Softening vegetables. Steady sizzle, no smoke."},
  ML:{lv:2,name:"Medium-low",hint:"Garlic in oil, or a covered simmer."},
  L:{lv:1,name:"Low",hint:"Gentle simmer: a few lazy bubbles, never a rolling boil."},
  OFF:{lv:0,name:"Heat off",hint:"Burner off. Residual heat finishes the job."},
  O425:{lv:-1,name:"Oven 425°F",hint:"Hot oven: browns and crisps."},
  O350:{lv:-1,name:"Oven 350°F",hint:"Moderate oven for gentle, even cooking."},
  O400:{lv:-1,name:"Oven 400°F",hint:"Hot oven for browning without burning."}
};
/* Recipes and the week plan live as JSON files in the data folder (see server.mjs):
   recipes/<id>.json  name, short, serves, time, gear, ing[], kid, warn?, leftovers, steps[], loved, lastCooked, added
   week.json  label, start (YYYY-MM-DD), nights[{recipe, day, date, iso}]
   Step fields: h (title), x (instructions), heat (H MH M ML L OFF O425 O350 or null), hint (this step's own line under the heat gauge), t (timer seconds),
   kid:true for the scoop step, a (animation override: sizzle simmer boil stir chop whisk sprinkle oven pour thaw cool baby serve). */
let LIB={},WEEKDOC=null,R=[],DB=null,dbState="loading",loadNote="";
const VIEWS=["library","plan","shop"];
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem("pwk:"+k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem("pwk:"+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0")};
const mins=t=>t>=60?Math.round(t/60)+" min":t+" sec";
const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayISO=()=>isoOf(new Date());
function ago(iso){if(!iso)return"Not cooked yet";const d=Math.round((parseISO(todayISO())-parseISO(iso))/864e5);
  return d<=0?"Made today":d===1?"Made yesterday":d<14?`Made ${d} days ago`:d<60?`Made ${Math.round(d/7)} weeks ago`:`Made ${Math.round(d/30)} months ago`}

function buildWeek(){R=(WEEKDOC&&WEEKDOC.nights||[]).filter(n=>LIB[n.recipe]).map(n=>({...LIB[n.recipe],id:n.recipe,day:n.day,date:n.date,iso:n.iso}))}
function todayId(){const k=todayISO(),r=R.find(x=>x.iso===k);return r?r.id:null}
function view(){const h=location.hash.slice(1);return VIEWS.includes(h)?h:"cook"}
function current(){const h=location.hash.slice(1);
  return R.find(r=>r.id===h)||(LIB[h]?{...LIB[h],id:h,day:"Box",date:""}:null)||R.find(r=>r.id===todayId())||R[0]||null}
function progress(r){const s=store.get("done:"+r.id,[]);return s.length/r.steps.length}

function flames(lv){let o='<span class="flames" aria-hidden="true">';for(let i=1;i<=5;i++)o+=`<i style="${i<=lv?`background:var(--h${i})`:""}"></i>`;return o+"</span>"}
function heatChip(k){if(!k||!HEAT[k])return"";const h=HEAT[k];
  if(h.lv<0)return`<span class="chip" style="color:var(--hot)">${h.name}</span>`;
  return`<span class="chip" style="color:${h.lv?`var(--h${h.lv})`:"var(--muted)"}">${flames(h.lv)}${h.name}</span>`}
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3.1 1.6-1.9 3-3.1 5.2-3.1 3.8 0 5.9 4 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';
function loveBtn(id){const on=!!(LIB[id]&&LIB[id].loved);
  return`<button class="love" data-love="${esc(id)}" aria-pressed="${on}" aria-label="${on?"Loved":"Love this recipe"}" ${DB?"":"disabled"}>${HEART}<span>${on?"Loved":"Love"}</span></button>`}

/* Marking a recipe made is one tap from the recipe page, not only by finishing every step in
   cook mode: "Pick one for me" and "Made 3 days ago" are only as good as this date. The tap
   is undoable for the session (madeUndo keeps the date it replaced). */
const madeUndo={};
function madeBtn(id){const on=!!(LIB[id]&&LIB[id].lastCooked===todayISO());
  return`<button class="love made" data-made="${esc(id)}" aria-pressed="${on}" ${DB?"":"disabled"}>${on?"✓ Made today":"We made this"}</button>`}
async function setMade(id,on){if(!DB||!LIB[id])return;const prev=LIB[id].lastCooked||null;
  let next;if(on){if(prev!==todayISO())madeUndo[id]=prev;next=todayISO()}
  else{if(!(id in madeUndo)){toast("Already marked as made today");return}next=madeUndo[id];delete madeUndo[id]}
  LIB[id]={...LIB[id],lastCooked:next||undefined};buildWeek();render();
  try{await DB.doc("recipes/"+id).update({lastCooked:next})}catch(x){LIB[id]={...LIB[id],lastCooked:prev||undefined};buildWeek();render();toast("Couldn't save. Check your connection.")}}
function renderNav(){const v=view();
  document.querySelectorAll(".views button").forEach(b=>b.setAttribute("aria-current",b.dataset.view===v));
  $("#weekLabel").textContent=(WEEKDOC&&WEEKDOC.label?WEEKDOC.label:"Your week")+(SET.tagline?" · "+SET.tagline:"");}
function renderRail(){
  const cur=view()==="cook"?current():null,td=todayId();
  $("#rail").hidden=!R.length||view()!=="cook";
  $("#rail").innerHTML=R.map(r=>`<button class="day" aria-current="${!!cur&&r.id===cur.id}" data-id="${esc(r.id)}">
    <span class="thumb">${dish(r)}</span><span class="d"><span>${esc(r.day)}${r.date?" · "+esc(r.date):""}</span>${r.id===td?'<span class="today">Tonight</span>':""}</span>
    <span class="n">${esc(r.short)}</span><span class="m">${esc(r.time)}</span>
    <span class="bar"><i style="width:${progress(r)*100}%"></i></span></button>`).join("");
  const rail=$("#rail"),on=rail.querySelector('[aria-current="true"]');
  if(on&&rail.scrollWidth>rail.clientWidth)rail.scrollLeft=Math.max(0,on.offsetLeft-rail.offsetLeft-16);
}
function emptyState(title,body,cta){return`<section class="empty"><div class="anim" style="margin:0 auto">${scene("cool")}</div><h2>${title}</h2><p>${body}</p>${cta||""}</section>`}
function renderCook(){
  const r=current();
  if(!r){$("#main").innerHTML=dbState==="loading"?emptyState("Opening the recipe box…",loadNote||"Your recipes and this week's plan are loading.")

/* ---------- plan a week: drag recipes onto days ----------

let plan=null,armed=null,planSave=null,confirmNew=false,planPending=false,planSeq=0,weekChain=Promise.resolve();
function planFromWeek(){
  const start=WEEKDOC&&WEEKDOC.start?WEEKDOC.start:todayISO();
  const days=Array(7).fill(null),batch=[];
  (WEEKDOC&&WEEKDOC.nights||[]).forEach(n=>{
    if(!n.iso){batch.push(n.recipe);return}
    const off=Math.round((parseISO(n.iso)-parseISO(start))/864e5);

}

  const nights=[];
  plan.days.forEach((id,i)=>{if(id&&LIB[id]){const d=dayDate(i);nights.push({recipe:id,day:DAYS[d.getDay()],date:MON[d.getMonth()]+" "+d.getDate(),iso:isoOf(d)})}});
  plan.batch.forEach(id=>{if(LIB[id])nights.push({recipe:id,day:"Any",date:"Batch",iso:null})});
  const doc={label:weekLabel(plan.start),start:plan.start,nights,saved:new Date().toISOString()};
  WEEKDOC=doc;buildWeek();planPending=true;const my=++planSeq;
  const st=$("#planStatus");if(st)st.textContent="Saving…";
  clearTimeout(planSave);
  planSave=setTimeout(()=>{weekChain=weekChain.then(async()=>{const say=t=>{const s=$("#planStatus");if(s)s.textContent=t};
    if(!DB){say("Not saved: the recipe folder is unavailable");planPending=false;return}
    try{await DB.doc("week/current").set(WEEKDOC);say("Saved")}
    catch(e){if(e.status===409){planPending=false;plan=null;armed=null;await DB.pull();toast("The plan changed on another device. Showing the latest; make your change again.")}
      else say("Didn't save. Check your connection.")}
    if(my===planSeq)planPending=false})},400);}
function place(id,slot,from){

    if(prev&&prev!==id&&from!=null&&from!=="batch")plan.days[+from]=prev;}   /* swap when moving between days */

}
function suggest(){

}

/* pointer drag: mouse starts on move, touch after a short hold */
let drag=null;
function slotAt(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;
  const s=el.closest("[data-slot]");if(s)return{slot:s.dataset.slot,el:s};
  if(el.closest("[data-tray]"))return{slot:"tray",el:el.closest("[data-tray]")};return null}

  const g=document.createElement("div");g.className="ghost";g.innerHTML=`<span class="tthumb">${dish({...LIB[drag.id],id:drag.id})}</span><span>${esc(LIB[drag.id].short||LIB[drag.id].name)}</span>`;

document.addEventListener("pointerdown",e=>{

  moveGhost(e.clientX,e.clientY)});

  armed=same?null:{id:d.id,from:d.from};renderPlan()}

  if(e.target.closest("#suggestOne")){const id=suggest();if(!id)return;const tdy=todayISO();
    let i=plan.days.findIndex((x,j)=>!x&&isoOf(dayDate(j))>=tdy);if(i<0)i=plan.days.findIndex(x=>!x);if(i<0)return;place(id,i,null);return}

});

/* ---------- shopping list from the plan ----------
   Pick which planned meals to shop for; ingredients are combined (same item + same unit add up),
   sorted by store section, with pantry basics listed separately to check at home. */
const FR={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125};
const UNITS=["packages","package","lb","lbs","oz","cups","cup","tbsp","tsp","cans","can","bags","bag","jars","jar","heads","head","bunches","bunch","packs","pack","pinch"];
const UNIT1={packages:"package",lbs:"lb",cups:"cup",cans:"can",bags:"bag",jars:"jar",heads:"head",bunches:"bunch",packs:"pack"};
const SECTIONS=[
 ["Frozen",/\b(frozen|tater tot)/],
 ["Canned & dry goods",/\b(coconut milk|breadcrumb|crushed tomato|diced tomato|tomato sauce|tomato paste|spaghetti)/],
 ["Produce",/\b(onion|garlic|carrot|celery|lemon|lime|potato|avocado|broccoli|scallion|green onion|cucumber|bell pepper|apple|banana|cilantro|parsley|basil|lettuce|spinach|ginger|mushroom|zucchini|cabbage|fresh|tomato|berr|blueberr|strawberr|lettuce)/],
 ["Meat & seafood",/\b(chicken thigh|chicken breast|beef|pork|sausage|shrimp|salmon|turkey|bacon|steak|ground)/],
 ["Dairy & eggs",/\b(egg|milk|butter|yogurt|cheese|cream)/],
 ["Bread & tortillas",/\b(tortilla|bread|bun|pita|wrap)/],
 ["Canned & dry goods",/\b(can|beans|broth|stock|rice|orzo|pasta|penne|noodle|lentil|flour|oats|tomato)/],
];
const PANTRY=/\b(salt|black pepper|^pepper\b|oil|spray|cumin|chili powder|thyme|paprika|oregano|red pepper flakes|soy sauce|mayo|vinegar|honey|sugar|cinnamon|garlic powder|onion powder|sriracha|hot sauce|seasoning|curry powder|baking powder|baking soda|vanilla|sesame seed|maple syrup|pickle|ketchup|mustard|syrup)/;
const SKIP=/\bwater\b|\(from |leftover/;
function num(s){s=s.trim();let m=s.match(/^(\d+)?\s*([½¼¾⅓⅔⅛])?/);if(!m||(!m[1]&&!m[2]))return null;return(+(m[1]||0))+(m[2]?FR[m[2]]:0)}
function fmtNum(n){const w=Math.floor(n),f=n-w;let best="",d=1;for(const[k,v]of Object.entries(FR))if(Math.abs(f-v)<d){d=Math.abs(f-v);best=k}
  if(f<.06)return String(w);if(f>.94)return String(w+1);return(w?w:"")+best}
function parseIng(raw){
  let s=raw.replace(/^for [a-z]+:\s*/i,"").replace(/\([^)]*\)/g,"").replace(/\s+/g," ").trim();
  let note="";const c=s.indexOf(",");if(c>0){note=s.slice(c+1).trim();s=s.slice(0,c).trim()}
  const m=s.match(/^((?:\d+\s*)?[½¼¾⅓⅔⅛]?)(?:\s*[–-]\s*((?:\d+\s*)?[½¼¾⅓⅔⅛]?))?\s+(.*)$/);
  let qty=null,unit="",name=s;
  if(m&&(m[1].trim())){qty=num(m[2]&&m[2].trim()?m[2]:m[1]);name=m[3];
    const w=name.split(" ")[0].toLowerCase();if(UNITS.includes(w)){unit=UNIT1[w]||w;name=name.slice(w.length).trim()}}
  name=name.replace(/^of\s+/,"").replace(/\s+for (the |adult |serving).*$/i,"").trim();name=name.charAt(0).toUpperCase()+name.slice(1);
  const sing=w=>/oes$/.test(w)?w.slice(0,-2):/ies$/.test(w)?w.slice(0,-3)+"y":/(ch|sh|ss|x)es$/.test(w)?w.slice(0,-2):/ss$/.test(w)?w:/s$/.test(w)&&w.length>3?w.slice(0,-1):w;
  const key=name.toLowerCase().replace(/\b(large|medium|small|raw|plain|full-fat|unsweetened|low-sodium|burrito-size|long-grain|cold)\b/g,"").replace(/[^a-z0-9 -]/g,"").split(/\s+/).filter(Boolean).map(sing).join(" ");
  return{qty,unit,name,key,note};
}
function sectionOf(key,name){const t=(key+" "+name).toLowerCase();if(PANTRY.test(t))return"Check the pantry";
  for(const[s,re]of SECTIONS)if(re.test(t))return s;return"Other"}
function buildList(ids){
  const items={};
  ids.forEach(id=>{const r=LIB[id];if(!r)return;
    r.ing.forEach(line=>line.split(/\s\+\s|;\s*/).forEach(part=>{if(!part.trim()||SKIP.test(part.toLowerCase()))return;
      const p=parseIng(part);if(!p.key)return;const sec=sectionOf(p.key,p.name);
      const it=items[p.key]||(items[p.key]={key:p.key,name:p.name,names:new Set(),sec,amt:{},loose:false,meals:new Set()});it.names.add(p.name);
      if(p.qty!=null)it.amt[p.unit]=(it.amt[p.unit]||0)+p.qty;else it.loose=true;
      it.meals.add(r.short||r.name)}))});
  return Object.values(items).map(it=>({...it,name:shopName(it)}));
}
/* One display name per merged line: "Full-fat oat milk" + "Plain oat milk" read as "Oat milk";
   "Large egg" + "Large eggs" with 24 of them read as "Large eggs". */
function shopName(it){const ns=[...it.names],plural=Object.entries(it.amt).some(([u,q])=>!u&&q>1);
  if(ns.length<2)return ns[0]||it.name;
  const base=new Set(ns.map(n=>n.toLowerCase().replace(/s$/,"")));
  if(base.size===1)return ns.find(n=>/s$/.test(n)===plural)||ns[0];
  const k=it.key.charAt(0).toUpperCase()+it.key.slice(1);return plural&&!/s$/.test(k)?k+"s":k}
const PL={cup:"cups",can:"cans",bag:"bags",jar:"jars",head:"heads",bunch:"bunches",pack:"packs"};
function amountText(it){if(it.sec==="Check the pantry")return"";
  return Object.entries(it.amt).map(([u,q])=>fmtNum(q)+(u?" "+(q>1&&PL[u]?PL[u]:u):"")).join(" + ")}
/* The list is shared: picks and ticks live in shop.json on the server, sent as one small
   operation per tap so two phones in two aisles both land. Keyed to the plan's start date. */
let SHOPDOC=null,clearArm=0;
const weekKey=()=>(WEEKDOC&&WEEKDOC.start)||"none";
const mealKey=r=>(r.iso||"any")+":"+r.id;
function shopState(){const d=SHOPDOC&&SHOPDOC.week===weekKey()?SHOPDOC:{pick:{},checks:[]};return{pick:d.pick||{},checks:new Set(d.checks||[])}}
function picked(r,st){const k=mealKey(r);return k in st.pick?!!st.pick[k]:(!r.iso||r.iso>=todayISO())}
async function shopOp(op){
  const d=SHOPDOC&&SHOPDOC.week===weekKey()?SHOPDOC:{week:weekKey(),pick:{},checks:[]};   // optimistic
  const c=new Set(d.checks||[]),pk={...(d.pick||{})};

/* ---------- data: the app's JSON-file API ----------
   Same small surface the page was written against (collection/doc onSnapshot, set, update).
   The server is polled for a revision fingerprint; a full pull happens only when it moves.
   Writes carry the revision they were based on, and a stale one forces a pull, so a change
   made to the files elsewhere between our last pull and our write is never masked. */
let SET={},KID="Kid",SCOOP="Pull their portion before seasoning.",DBERR="",WEEKREV=null,CLOCK=0,PUSH=false;
function applySettings(s){SET=s||{};KID=SET.kid||"Kid";SCOOP=SET.scoop||"Pull their portion before seasoning.";
  const t=SET.title||"Week",a=SET.accent||"Kitchen";document.title=t+" "+a;
  $("#titleMain").textContent=t+" ";$("#titleAccent").textContent=a}
const serverNow=()=>Date.now()+CLOCK;   // timers end on the server's clock, not this device's
function KitchenDB(){
  const subs={recipes:[],week:[]};let rev=null,last=null,busy=false;
  const snapR=st=>({docs:Object.entries(st.recipes||{}).map(([id,d])=>({id,data:()=>d})),metadata:{fromCache:false}});
  const snapW=st=>({exists:!!st.week,data:()=>st.week,metadata:{fromCache:false}});
  const fan=(fn)=>{[...subs.recipes,...subs.week].forEach(fn)};
  async function pull(){
    let st;try{const t0=Date.now();st=await (await fetch("api/state",{cache:"no-store"})).json();if(st.now)CLOCK=st.now-Math.round((t0+Date.now())/2)}
    catch(e){DBERR="Can't reach the kitchen app.";fan(s=>s[1]&&s[1](e));return}
    if(!st.ok){DBERR=st.error==="data_dir_missing"?"The data folder "+st.dataDir+" isn't there. Is the network share mounted?":"The recipe folder couldn't be read.";
      rev=null;fan(s=>s[1]&&s[1](new Error(st.error)));return}
    DBERR="";rev=st.rev;applySettings(st.settings);
    SHOPDOC=st.shop||null;TIMERS=st.timers||[];PUSH=!!st.push;drawTray();
    // A plan being edited here wins until its save lands; then the file is the truth again.
    if(planPending){st={...st,week:WEEKDOC}}else{WEEKREV=st.weekRev;if(view()==="plan"&&!armed&&!(drag&&drag.active))plan=null}
    last=st;
    // Week first: the recipes update re-renders too, and the planner must rebuild from the file's week, not ours.
    subs.week.forEach(s=>s[0](snapW(st)));subs.recipes.forEach(s=>s[0](snapR(st)));
  }
  async function poll(){
    if(busy||document.hidden||(drag&&drag.active))return;busy=true;
    try{const r=await (await fetch("api/rev",{cache:"no-store"})).json();if(r.rev!==rev||!last)await pull()}catch(e){}
    busy=false}
  async function write(method,url,data,headers){
    const r=await fetch(url,{method,headers:{"content-type":"application/json",...(headers||{})},body:JSON.stringify(data)});
    if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}
    return r.json()}
  busy=true;pull().finally(()=>{busy=false});setInterval(poll,4000);document.addEventListener("visibilitychange",poll);
  return{
    pull:async()=>{busy=true;try{await pull()}finally{busy=false}},
    collection:()=>({onSnapshot(ok,err){subs.recipes.push([ok,err]);if(last)ok(snapR(last))}}),
    doc:p=>({onSnapshot(ok,err){subs.week.push([ok,err]);if(last)ok(snapW(last))},
      // The week refuses a stale write (409): x-base-week is the week.json revision this plan was built on.
      set:async data=>{const j=await write("PUT","api/week",data,{"x-base-week":WEEKREV||"-"});WEEKREV=j.weekRev;return j},
      update:data=>write("PATCH","api/recipes/"+encodeURIComponent(p.split("/")[1]),data)})};}

async function boot(){
  render();
  const timer=setTimeout(()=>{if(dbState==="loading"){loadNote="Still waiting on the recipe box. It may be offline right now.";render()}},10000);
  DB=KitchenDB();
  let gotR=false,gotW=false;const settle=()=>{if(gotR&&gotW){dbState="ready";clearTimeout(timer)}};
  DB.collection("recipes").onSnapshot(snap=>{LIB={};snap.docs.forEach(d=>{LIB[d.id]=d.data()});
      if(!snap.metadata.fromCache)gotR=true;settle();buildWeek();if($("#cm").hidden)render()},
    ()=>{gotR=true;settle();render()});
  DB.doc("week/current").onSnapshot(snap=>{WEEKDOC=snap.exists?snap.data():null;if(!snap.metadata.fromCache)gotW=true;settle();buildWeek();if($("#cm").hidden)render()},
    ()=>{gotW=true;settle();render()});
}


/* ---------- cook mode ---------- */
let cmIdx=0;
function gaugeSVG(k){
  const h=k?HEAT[k]:null,lv=h?h.lv:0,segs=[];
  for(let i=0;i<5;i++){const a0=Math.PI*(1-i/5)-0.03,a1=Math.PI*(1-(i+1)/5)+0.03,R1=90,R0=62,cx=110,cy=104;
    const p=(r,a)=>`${(cx+r*Math.cos(a)).toFixed(1)} ${(cy-r*Math.sin(a)).toFixed(1)}`;
    segs.push(`<path d="M${p(R0,a0)} L${p(R1,a0)} A${R1} ${R1} 0 0 1 ${p(R1,a1)} L${p(R0,a1)} A${R0} ${R0} 0 0 0 ${p(R0,a0)}Z" fill="${i<lv?`var(--h${i+1})`:"var(--gauge-off)"}"/>`)}
  const ang=Math.PI*(1-Math.max(lv-.5,0)/5),nx=110+54*Math.cos(ang),ny=104-54*Math.sin(ang);
  const oven=h&&h.lv<0;
  return `<svg viewBox="0 0 220 116" role="img" aria-label="${h?h.name:"No heat needed"}">${oven?
    `<rect x="40" y="22" width="140" height="84" rx="12" fill="var(--gauge-off)"/><rect x="56" y="38" width="108" height="52" rx="6" fill="var(--hot)" opacity=".85"/><text x="110" y="72" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="20" fill="#fff">${k.slice(1)}°F</text>`
    :segs.join("")+(lv?`<line x1="110" y1="104" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><circle cx="110" cy="104" r="9" fill="var(--ink)"/>`:"")}</svg>`;
}
function openCook(i){cmIdx=i;$("#cm").hidden=false;document.body.style.overflow="hidden";drawCook();requestWake()}
function closeCook(){$("#cm").hidden=true;document.body.style.overflow="";releaseWake();render()}
function drawCook(){
  const r=current(),s=r.steps[cmIdx],done=store.get("done:"+r.id,[]),h=s.heat?HEAT[s.heat]:null;
  store.set("at:"+r.id,cmIdx);
  $("#cm").innerHTML=`<div><div class="cm-top"><span class="t">${esc(r.name)}</span><button class="x" id="cmClose" aria-label="Close cook mode">×</button></div>
   <div class="cm-prog">${r.steps.map((_,j)=>`<i class="${j<=cmIdx||done.includes(j)?"y":""}"></i>`).join("")}</div></div>
   <div class="cm-body"><div>
     <div class="anim">${scene(kindOf(s),true)}</div>
     <div class="cm-n">STEP ${cmIdx+1} OF ${r.steps.length}</div>
     <h2 class="cm-h">${esc(s.h)}</h2>
     ${s.t?timerBtn(r,cmIdx,s,"ph"):""}
     ${s.kid?`<div class="note" style="margin-bottom:14px;font-size:17px"><b>${esc(KID)} scoop.</b> ${esc(SCOOP)}</div>`:""}
     <div class="cm-txt">${s.x}</div></div>
     <div class="cm-side"><div class="gauge">${gaugeSVG(s.heat)}<div class="lv" style="color:${h&&h.lv>0?`var(--h${h.lv})`:h&&h.lv<0?"var(--hot)":"var(--muted)"}">${h?h.name:"No heat"}</div><div class="hint">${esc(s.hint||(h?h.hint:"Prep step. Burner can stay off."))}</div></div>
      ${s.t?timerBtn(r,cmIdx,s,"wd"):""}</div></div>
   <div class="cm-nav"><button id="cmPrev" ${cmIdx===0?"disabled":""}>← Back</button><button class="next" id="cmNext">${cmIdx===r.steps.length-1?"Finish ✓":"Done, next step →"}</button></div>`;
  $("#cmClose").onclick=closeCook;
  $("#cmPrev").onclick=()=>{if(cmIdx>0){cmIdx--;drawCook()}};
  $("#cmNext").onclick=()=>{const d=new Set(store.get("done:"+r.id,[]));d.add(cmIdx);store.set("done:"+r.id,[...d]);
    if(cmIdx<r.steps.length-1){cmIdx++;drawCook()}else{store.set("at:"+r.id,0);store.set("done:"+r.id,[]);store.set("ing:"+r.id,[]);closeCook();party(r);
      if(LIB[r.id]&&LIB[r.id].lastCooked!==todayISO())setMade(r.id,true)}};
  document.querySelectorAll("#cm .bigtimer").forEach(b=>b.onclick=()=>{unlockAudio();if(!TIMERS.some(t=>t.key===b.dataset.tkey))addTimer(r.short+": "+s.h,s.t,b.dataset.tkey)});
}
document.addEventListener("keydown",e=>{if($("#cm").hidden)return;
  if(e.key==="Escape")closeCook();if(e.key==="ArrowRight")$("#cmNext").click();if(e.key==="ArrowLeft"&&cmIdx>0)$("#cmPrev").click()});

/* ---------- timers ---------- */
/* Timers are held by the server: they survive a reload, show on every device, and (with
   timer_notify set) push to the phone of whoever started one, which rings through a lock screen. */
let TIMERS=[],actx=null,rangLocal=new Set();
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(){if(!actx)return;try{[0,.35,.7].forEach(off=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime+off;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start(t);o.stop(t+.3)})}catch(e){}}
const ringing=t=>!!t.rung||serverNow()>=t.end;
function timerBtn(r,i,s,where){const key=r.id+":"+i,t=TIMERS.find(x=>x.key===key);
  return`<button class="bigtimer ${where} ${t?"on":""}" data-tkey="${esc(key)}"><span>${t?(ringing(t)?"Timer done":"Timer running"):"Start timer"}</span><span class="tm">${t?(ringing(t)?"0:00":fmt((t.end-serverNow())/1000)):fmt(s.t)}</span></button>`}
async function timerCall(method,url,body){try{const r=await fetch(url,{method,headers:{"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
    const j=await r.json();if(j.timers)TIMERS=j.timers;if(!r.ok&&r.status!==404)throw 0}
  catch(x){toast("Couldn't reach the kitchen app. Timer not changed.")}drawTray();if(!$("#cm").hidden)drawCook()}
function addTimer(label,sec,key){if(!PUSH&&!actx)unlockAudio();timerCall("POST","api/timers",{label,sec,key});
  if(!PUSH)toast("Timer set. Keep this screen open.")}
function drawTray(){
  $("#tray").innerHTML=[...TIMERS].sort((a,b)=>a.end-b.end).map(t=>{const left=(t.end-serverNow())/1000,rg=ringing(t);
    return`<div class="tmr ${rg?"ring":""}"><span class="l">${esc(t.label)}</span><span class="c">${rg?"Done":fmt(left)}</span>
    ${rg?"":`<button data-add="${t.id}">+1 min</button>`}<button data-del="${t.id}">${rg?"OK":"Cancel"}</button></div>`}).join("");
  document.documentElement.style.setProperty("--tray-h",(TIMERS.length?$("#tray").offsetHeight:0)+"px");
  document.querySelectorAll("#cm .bigtimer.on").forEach(b=>{const t=TIMERS.find(x=>x.key===b.dataset.tkey);if(!t)return;
    b.querySelector(".tm").textContent=ringing(t)?"0:00":fmt((t.end-serverNow())/1000);b.firstElementChild.textContent=ringing(t)?"Timer done":"Timer running"});
}
$("#tray").addEventListener("click",e=>{const a=e.target.dataset.add,d=e.target.dataset.del;
  if(a)timerCall("POST","api/timers/"+a,{add:60});if(d)timerCall("DELETE","api/timers/"+d)});
setInterval(()=>{if(!TIMERS.length)return;let ringNow=false;
  TIMERS.forEach(t=>{if(ringing(t)&&!rangLocal.has(t.id)){rangLocal.add(t.id);ringNow=true}});
  if(ringNow)beep();if(TIMERS.some(ringing)&&Date.now()%3000<500)beep();drawTray()},500);

async function requestWake(){if($("#cm").hidden||wake)return;try{wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}catch(e){}}

document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")requestWake()});["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));

/* ---------- cute animation library (reusable scenes) ---------- */
const W="#fff";
function face(cx,cy,mood){
  const eyes=mood==="sleep"
    ?`<path d="M${cx-13} ${cy} q4 4 8 0 M${cx+5} ${cy} q4 4 8 0" stroke="var(--ink)" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
    :`<g class="a-blink"><circle cx="${cx-9}" cy="${cy}" r="3.6" fill="var(--ink)"/><circle cx="${cx+9}" cy="${cy}" r="3.6" fill="var(--ink)"/>
      <circle cx="${cx-8}" cy="${cy-1.4}" r="1.2" fill="${W}"/><circle cx="${cx+10}" cy="${cy-1.4}" r="1.2" fill="${W}"/></g>`;
  const mouth=mood==="wow"?`<ellipse cx="${cx}" cy="${cy+9}" rx="3.6" ry="4.4" fill="var(--ink)"/>`
    :mood==="sleep"?`<path d="M${cx-3} ${cy+9} q3 2 6 0" stroke="var(--ink)" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
    :`<path d="M${cx-6} ${cy+7} q6 6 12 0" stroke="var(--ink)" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  return eyes+mouth+`<ellipse cx="${cx-17}" cy="${cy+6}" rx="5" ry="3" fill="var(--h4)" opacity=".55"/><ellipse cx="${cx+17}" cy="${cy+6}" rx="5" ry="3" fill="var(--h4)" opacity=".55"/>`;
}
/* face sits on a light "label" patch so it reads on any pot color */
function potBody(mood){return `
  <rect x="38" y="84" width="10" height="16" rx="5" fill="var(--flame)"/><rect x="152" y="84" width="10" height="16" rx="5" fill="var(--flame)"/>
  <path d="M46 74 h108 v42 a18 18 0 0 1 -18 18 h-72 a18 18 0 0 1 -18 -18z" fill="var(--flame)"/>
  <ellipse cx="100" cy="100" rx="34" ry="21" fill="var(--panel)"/>${face(100,96,mood)}`}

const SCENE_CAP={simmer:"Low and slow",boil:"Rolling boil",stir:"Stir, stir",sizzle:"Sizzle time",chop:"Prep station",whisk:"Whisk it",
  sprinkle:"Season time",oven:"In the oven",pour:"Pour it in",thaw:"Thawing",cool:"Resting",baby:"",serve:"Dinner time"};
function scene(kind,cap){return `<svg viewBox="0 0 200 156" aria-hidden="true">${(SCENES[kind]||SCENES.stir)()}</svg>${cap?`<div class="cap">${kind==="baby"?esc(KID)+"'s bowl":SCENE_CAP[kind]||""}</div>`:""}`}
function kindOf(s){
  if(s.a&&SCENES[s.a])return s.a;
  if(s.kid)return "baby";
  const t=(s.h+" "+s.x).toLowerCase(),h=s.h.toLowerCase();
  if(s.heat&&s.heat[0]==="O")return /whisk/.test(h)?"whisk":/pour/.test(h)?"pour":"oven";
  if(/thaw/.test(h))return "thaw";
  if(/whisk|scramble/.test(h))return "whisk";
  if(/cool|freeze|rest/.test(h))return "cool";
  if(/serve|finish off|^finish$/.test(h))return "serve";
  if(/season|spice|sprinkle/.test(h))return "sprinkle";
  if(/split|pour|drain|save water|broth in|into the pasta/.test(h))return "pour";
  if(/boil/.test(h)||s.heat==="H")return "boil";
  if(/simmer|rice for/.test(h)||s.heat==="L")return "simmer";
  if(/sear|brown|fry|sizzle/.test(h)||s.heat==="MH")return "sizzle";
  if(!s.heat||/prep|gather|everything|cut|roll/.test(h))return "chop";
  if(s.heat==="ML")return "simmer";
  return "stir";
}
function party(r){
  const p=document.createElement("div");p.className="party";
  p.innerHTML=`<div class="party-card">${r.art?dish(r):scene("serve")}<h2>Dinner's ready!</h2><p>${esc(r.short)} is done. Nice work.</p></div>`;
  const cols=["var(--h1)","var(--h3)","var(--h4)","var(--h5)","var(--kid)","var(--flame)"];
  for(let i=0;i<60;i++){const c=document.createElement("i");c.className="confetti";
    c.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%cols.length]};animation-delay:${Math.random()*.8}s;animation-duration:${2+Math.random()*1.4}s`;p.appendChild(c)}
  const done=()=>p.remove();p.onclick=done;setTimeout(done,4200);document.body.appendChild(p);
}
